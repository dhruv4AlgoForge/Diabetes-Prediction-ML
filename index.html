
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <header>
            <h1>Diabetes Prediction</h1>
            <p>Machine Learning Based Health Risk Assessment</p>
        </header>

        <form method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label>Pregnancies</label>
                    <input type="number" name="Pregnancies"
                           min="0" step="1" required>
                </div>

                <div class="form-group">
                    <label>Glucose Level</label>
                    <input type="number" name="Glucose"
                           min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label>Blood Pressure</label>
                    <input type="number" name="BloodPressure"
                           min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label>Skin Thickness</label>
                    <input type="number" name="SkinThickness"
                           min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label>Insulin</label>
                    <input type="number" name="Insulin"
                           min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label>BMI</label>
                    <input type="number" name="BMI"
                           min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label>Diabetes Pedigree Function</label>
                    <input type="number"
                           name="DiabetesPedigreeFunction"
                           min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="Age"
                           min="1" step="1" required>
                </div>

            </div>

            <button type="submit">Predict Diabetes Risk</button>

        </form>

        {% if prediction %}
        <div class="result">
            <h2>{{ prediction }}</h2>

            {% if probability is not none %}
                <p>Estimated model probability:
                    <strong>{{ "%.2f"|format(probability) }}%</strong>
                </p>
            {% endif %}
        </div>
        {% endif %}

        <footer>
            <p>Educational project only. Not a medical diagnosis.</p>
        </footer>

    </div>

</body>
</html>
